[project]
name = "construction_management"
version = "0.1.0"
description = "Construction Management extension for ERPNext"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "frappe",
    "erpnext",
]

[build-system]
requires = ["flit_core>=3.4.0,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "construction_management"
